context:
  version: "0.3.1"
  build_number: 2

  # ELF machine token `file` prints for the target; checked by the arch test
  elf_arch: ${{ "x86-64" if target_platform == "linux-64" else "aarch64" if target_platform == "linux-aarch64" else "PowerPC" if target_platform == "linux-ppc64le" else "RISC-V" if target_platform == "linux-riscv64" else "S/390" if target_platform == "linux-s390x" else "" }}

  # ocaml_win-64 ships gcc_* and vs2022_* at the same version/build; name the track.
  c_toolchain: ${{ "" if unix else c_compiler ~ "_*" }}
  library: ${{ "Library/" if not unix else "" }}

package:
  name: ocaml-seq
  version: ${{ version }}

source:
  url: https://github.com/c-cube/seq/archive/v${{ version }}.tar.gz
  sha256: 6bc8beb15f0a678dbd6f8b4f75a2cc45fa2d9e4cf545eafe9fb057c97c9914cf

build:
  number: ${{ build_number }}
  string: ${{ c_compiler ~ "_" if not unix }}h${{ hash }}_${{ build_number }}
  script:
    - if: unix
      then:
        - dune build --profile=release -p seq @install
        - dune install --prefix="${PREFIX}" --libdir="${PREFIX}/lib/ocaml" seq
      else:
        # Plain cmd.exe, not MSYS2 bash: pure OCaml, no stubs, so no wrapper is
        # needed and the backslashed install prefix reaches dune intact. The
        # dune cache trips over mixed path separators on windows.
        # dune install also opens the shared cache; disable it for every dune call
        - set DUNE_CACHE=disabled
        - dune build --cache=disabled --profile=release -p seq @install
        - if errorlevel 1 exit 1
        - dune install --prefix="%LIBRARY_PREFIX%" --libdir="%LIBRARY_PREFIX%\lib\ocaml" seq
        - if errorlevel 1 exit 1

requirements:
  build:
    - ${{ compiler("ocaml") }}
    - if: not unix and c_compiler == "gcc"
      then:
        - ${{ stdlib("m2w64_c") }}
      else:
        - ${{ stdlib("c") }}
    # ocaml_win-64 >=14 only run-constrains the C compiler; activate it here, once (vs2022, zig)
    - if: not unix and c_compiler != "gcc"
      then:
        - ${{ compiler("c") }}
    # compiler("ocaml") renders no toolchain track; name it on windows
    - if: not unix
      then:
        - ocaml_${{ target_platform }} ${{ ocaml_compiler_version }}.* ${{ c_toolchain }}
    # the cross compiler does not pull the native one; the build runs OCaml on the build machine
    - if: build_platform != target_platform and unix
      then:
        - ocaml_${{ build_platform }} ${{ ocaml_compiler_version }}.*
        # ocaml >=17: the cross compiler activates itself (shims, OCAMLLIB, host OCAMLPATH) and has natdynlink
        - ocaml_${{ target_platform }}[version="${{ ocaml_compiler_version }}.*", build_number=">=17"]
    # windows cross: the self-contained gcc track needs no vcvars
    - if: build_platform != target_platform and not unix
      then:
        - ocaml_${{ build_platform }} ${{ ocaml_compiler_version }}.* gcc_*
    - ocaml-dune >=2.5
  host:
    # library: ocaml's run_export pins the compiler patch version
    - ocaml ${{ ocaml_compiler_version }}.*
    # the noarch ocaml metapackage does not pin the windows toolchain track
    - if: not unix
      then:
        - ocaml_${{ target_platform }} ${{ ocaml_compiler_version }}.* ${{ c_toolchain }}
  # the ocaml run_export does not encode the windows toolchain track
  run_constraints:
    - if: not unix
      then:
        - ocaml_${{ target_platform }} ${{ ocaml_compiler_version }}.* ${{ c_toolchain }}

tests:
  - package_contents:
      strict: true
      files:
        - ${{ library }}lib/ocaml/seq/*
        - ${{ library }}doc/seq/*
  # cross lanes test under qemu binfmt, which would also run a build-machine
  # binary; check the native objects' ELF headers name the target instead
  - if: linux
    then:
      script:
        # test scripts are not jinja-rendered; hand the token over by env
        env:
          ELF_ARCH: ${{ elf_arch }}
        content:
          - set -eu
          - found=0
          - tmp="$(mktemp -d)"
          - |
            for a in $(find "${PREFIX}/lib/ocaml/seq" -name '*.a'); do
              found=1
              d="${tmp}/$(basename "$a")"
              mkdir -p "$d"
              (cd "$d" && ar x "$a")
              out="$(find "$d" -name '*.o' -exec file -L {} +)"
              echo "$out"
              if echo "$out" | grep -v "${ELF_ARCH}" | grep -q .; then exit 1; fi
            done
          - |
            for s in $(find "${PREFIX}/lib/ocaml/stublibs" -name 'dll*seq*.so' 2>/dev/null); do
              found=1
              out="$(file -L "$s")"
              echo "$out"
              if echo "$out" | grep -v "${ELF_ARCH}" | grep -q .; then exit 1; fi
            done
          - test "$found" = 1
      requirements:
        build:
          - file
          - binutils

about:
  homepage: https://github.com/c-cube/seq
  repository: https://github.com/c-cube/seq
  summary: Compatibility package for OCaml's standard iterator type since 4.07
  license: LGPL-2.1-or-later WITH OCaml-LGPL-linking-exception
  license_file: LICENSE

extra:
  recipe-maintainers:
    - ManuelLerchner
    - MementoRC
